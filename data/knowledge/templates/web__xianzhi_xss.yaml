evidence_chain:
- robots.txt discloses /static/secretkey.txt -> 'you-will-never-guess' (session/secret
  key for xianzhi_xss)
- Target serves 21 xianzhi XSS labs under /xssN_*/; root Apache index; no session
  cookies issued on any probed path; no /login /admin /api endpoints (404).
- xss3_json/ returns application/json user object for user id=2 (endpoint echoes JSON,
  no auth).
- xss17_passiveElement reflects GET param 'content' raw into <div data-content='...'>.
  xss14_hidden reflects param 'token' HTML-encoded into hidden input value.
- '[claude] 目标上不存在身份验证/会话/API 表面：所有 19 个实验路径上均无 Set-Cookie，没有登录/注销/注册/api/会话端点（404），server-status
  403，TRACE 405；伪造的 cookies (PHPSESSID/admin=1) 没有产生任何影响。'
- '[claude] xss3_json 无论 ?id 值（0,1,3,10,admin）或 ?callback 如何，都返回相同的静态用户 id=2 JSON；无基于
  id 的访问，无身份验证。'
