- Native Worker completed a bounded evidence-backed observation
- 'Recon lane conclusions: username sink is numeric-eval SQLi context (0+(...)+0),
  so my earlier raw-HTML XSS check was a misread of output context (payload was evaluated,
  not stored). Public surface: 4 PHP scripts + static dirs + uploads/{a.jpeg,a.jpg,1.jpg}.
