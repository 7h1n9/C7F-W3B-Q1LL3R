  (md5(key+Xread+scan)==md5(key+X+readscan)). waf only blocks gopher/file prefixes;
  bare path /proc/self/cwd/flag.txt opens fine via Py2 urlopen. Flag: <FLAG>. PoC:
  shared/poc_ssrfme.md'
