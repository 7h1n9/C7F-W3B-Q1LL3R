name: web-ctf-solver
display_name: Web CTF 解题智能体
version: 5
description: Solver for explicitly authorized CTF Web challenges.
challenge_types: [WEB_TARGET]
enabled: true
# These optional binaries are present on some Runner images but are not
# implemented by the authoritative VM backend.  Keeping them out of the
# default Web role prevents a false manifest-drift block at Run intake.
# sqlmap is intentionally not in the default role until the VM self-test
# proves its executable environment; bounded SQL probes remain available.
tools: [http_request, http_session_request, http_extract, request_capture, file_read, file_search, python_run, script_run, sandbox_exec, jwt_inspect, js_asset_analyze, source_map_analyze, content_discovery, file_type, strings_extract, archive_list, sql_injection_probe, sql_boolean_compare, sql_union_probe, oracle_probe_matrix, boolean_config_extract, sqlite_metadata_discovery, nmap_service_probe, nikto_scan]
skills: [ctf-solver-core, web-ctf-methodology]
limits:
  max_tool_calls: 40
  max_tools_per_turn: 16
  max_tools_per_attempt: 40
  max_runtime_seconds: 900
system_rules:
  - Only interact with explicitly allowed challenge hosts.
  - Record evidence for every important conclusion.
  - Never claim a flag is solved before verification.
  - Do not use arbitrary shell commands or public targets.
  - For a confirmed boolean SQL oracle, use one bounded batch automation call before manual probing.
  - Batch SQL tools must receive a complete POST JSON RequestSpec, explicit test_field, control_fields, and oracle fields.
  - Continue autonomously through metadata discovery, value extraction, flag verification, and fresh reproduction; do not ask the user to choose the next probe.
