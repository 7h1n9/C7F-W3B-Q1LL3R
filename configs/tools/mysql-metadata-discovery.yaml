name: mysql_metadata_discovery
display_name: MySQL Metadata Discovery
category: web
description: Bounded MySQL metadata discovery through the confirmed Web Boolean Oracle; never connects to port 3306.
risk_level: high
enabled: true
parameters:
  dbms: {type: string, required: false}
  discovery_scope: {type: string, required: false}
  request: {type: object, required: true}
  test_field: {type: string, required: true}
  baseline_value: {type: string, required: true}
  control_fields: {type: object, required: false}
  oracle: {type: object, required: true}
  extraction_profile: {type: object, required: false}
  target_expression: {type: string, required: true}
  expression_type: {type: string, required: true}
  supporting_evidence_ids: {type: array, items: {type: string}, required: true}
  supporting_fact_ids: {type: array, items: {type: string}, required: true}
  source_hypothesis_id: {type: string, required: true}
  approved_analysis_review_id: {type: string, required: true}
  assumption_status: {type: string, required: true}
  stage: {type: string, required: false}
  candidate_table: {type: string, required: false}
  max_tables: {type: integer, required: false}
  max_columns: {type: integer, required: false}
  max_name_length: {type: integer, required: false}
  max_requests: {type: integer, required: false}
  resume: {type: boolean, required: false}
permissions: {target_allowlist_required: true}
