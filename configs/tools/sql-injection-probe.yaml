name: sql_injection_probe
display_name: SQL Injection Probe
category: web
description: Run a bounded SQL syntax and boolean differential probe against an authorized challenge endpoint.
risk_level: medium
enabled: true
parameters:
  request:
    type: object
    required: true
    additionalProperties: true
    properties:
      method: {type: string, default: POST}
      url: {type: string}
      headers: {type: object, additionalProperties: true}
      json: {type: object, additionalProperties: true}
      form: {type: object, additionalProperties: true}
  test_field: {type: string, required: true}
  control_fields: {type: object, required: false, additionalProperties: true}
  baseline_value: {type: string, required: false}
  true_condition: {type: string, required: false}
  false_condition: {type: string, required: false}
  comment_styles: {type: array, items: {type: string}, required: false}
  max_requests: {type: integer, required: false}
limits: {max_requests: 40, concurrency: 2}
permissions: {target_allowlist_required: true}
