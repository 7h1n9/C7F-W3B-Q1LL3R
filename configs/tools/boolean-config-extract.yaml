name: boolean_config_extract
display_name: Boolean Configuration Extract
category: web
description: Bounded resumable extraction through a confirmed boolean oracle.
risk_level: high
parameters:
  request:
    type: object
    required: true
    additionalProperties: true
    properties:
      method: {type: string, description: HTTP method, default: POST}
      url: {type: string, description: Absolute authorized challenge URL}
      headers: {type: object, additionalProperties: true}
      json: {type: object, additionalProperties: true}
      form: {type: object, additionalProperties: true}
  test_field: {type: string, required: true}
  baseline_value: {type: string, required: true}
  target_expression: {type: string, required: true}
  oracle:
    type: object
    required: true
    additionalProperties: true
    properties:
      json_field: {type: string, default: matched}
      true_value: {type: boolean, default: true}
      false_value: {type: boolean, default: false}
  control_fields: {type: object, required: false, additionalProperties: true}
  max_requests: {type: integer, required: false}
  max_length: {type: integer, required: false}
limits: {max_requests: 1024, timeout_seconds: 30, concurrency: 2}
permissions: {target_allowlist_required: true}
